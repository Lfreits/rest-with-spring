# Especificação do projeto Xcode, lida pelo XcodeGen (https://github.com/yonaskolb/XcodeGen).
# O .xcodeproj NÃO é versionado: ele é gerado no CI (macOS) com `xcodegen generate`.
# O XcodeGen é ferramenta de build apenas; nada dele é incluído no app.
name: NoScroll

options:
  bundleIdPrefix: app.noscroll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NoScroll:
    type: application
    platform: iOS
    sources:
      - path: NoScroll
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: NoScroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.noscroll.NoScroll
        TARGETED_DEVICE_FAMILY: "1"

  NoScrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NoScrollTests
    dependencies:
      - target: NoScroll
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.noscroll.NoScrollTests

schemes:
  NoScroll:
    build:
      targets:
        NoScroll: all
    test:
      targets:
        - NoScrollTests
